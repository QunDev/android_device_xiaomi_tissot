plugins { id 'com.android.application' }
android {
    namespace 'com.qundev.fakelocation'; compileSdk 33
    defaultConfig { applicationId "com.qundev.fakelocation"; minSdk 31; targetSdk 33; versionCode 1; versionName "1.0" }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
dependencies { compileOnly fileTree(dir: 'libs', include: ['*.jar']) }
